<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>樂業附幼｜我要接孩子</title>
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
      color: #333;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      max-width: 400px;
      margin: 20px auto;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    .status {
      font-weight: bold;
      color: #2b7a78;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏫 樂業附幼｜我要接孩子</h2>
    <div id="loading">載入家長資料中，請稍候...</div>
    
    <div id="user-info" style="display: none;">
      <img id="pictureUrl" class="avatar" src="" alt="大頭照">
      <p>親愛的 <strong id="displayName"></strong> 家長，您好！</p>
      <p class="status">✅ LINE 身份連線成功！</p>
    </div>
  </div>

  <script>
    async function main() {
      try {
        // 初始化 LIFF
        await liff.init({ liffId: "2011537895-J5qnPyFm" });
        
        if (liff.isLoggedIn()) {
          // 取得用戶個人資料
          const profile = await liff.getProfile();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('user-info').style.display = 'block';
          document.getElementById('displayName').innerText = profile.displayName;
          document.getElementById('pictureUrl').src = profile.pictureUrl || 'https://via.placeholder.com/80';
        } else {
          // 若未登入，引導登入
          liff.login();
        }
      } catch (error) {
        console.error("LIFF 初始化失敗", error);
        document.getElementById('loading').innerText = '載入失敗，請從 LINE 重新打開頁面。';
      }
    }

    main();
  </script>
</body>
</html>
