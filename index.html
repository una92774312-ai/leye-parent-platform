<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>樂業附幼｜行政管理平台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --green:#2e7d32;
  --green-dark:#1b5e20;
  --green-light:#e8f5e9;

  --blue:#1976d2;
  --blue-light:#e3f2fd;

  --orange:#ef6c00;
  --orange-light:#fff3e0;

  --purple:#7b1fa2;
  --purple-light:#f3e5f5;

  --red:#d32f2f;
  --red-light:#ffebee;

  --yellow:#f9a825;
  --yellow-light:#fff8e1;

  --gray:#607d8b;

  --text:#263238;
  --muted:#78909c;
  --line:#dfe7e9;
  --bg:#f3f6f5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Roboto,
    sans-serif;
}

.app{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.header{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  margin-bottom:16px;
}

.headerTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}

.brand{
  font-size:1.35rem;
  font-weight:900;
  color:var(--green-dark);
}

.subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.55;
}

.loginState{
  margin-top:14px;
  padding:12px;
  background:var(--green-light);
  border-radius:12px;
  color:var(--green-dark);
  font-size:.9rem;
  line-height:1.6;
}

.testBox{
  margin-top:14px;
  padding:14px;
  background:var(--yellow-light);
  border:1px solid #ffe0b2;
  border-radius:13px;
}

.testTitle{
  font-weight:900;
  color:#8d6e00;
  margin-bottom:8px;
}

.helper{
  font-size:.8rem;
  color:var(--muted);
  line-height:1.55;
  margin-top:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1.5px solid #cfd8dc;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
  background:#fff;
}

textarea{
  resize:vertical;
}

.loginGrid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  margin-top:10px;
}

button{
  font-family:inherit;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:900;
  cursor:pointer;
  font-size:.88rem;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.btnGreen{
  background:var(--green);
  color:#fff;
}

.btnBlue{
  background:var(--blue);
  color:#fff;
}

.btnOrange{
  background:var(--orange);
  color:#fff;
}

.btnRed{
  background:var(--red);
  color:#fff;
}

.btnGray{
  background:var(--gray);
  color:#fff;
}

.summaryGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.summaryCard{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.summaryLabel{
  color:var(--muted);
  font-size:.82rem;
  font-weight:700;
}

.summaryNumber{
  margin-top:5px;
  font-size:1.7rem;
  font-weight:900;
}

.red{
  color:var(--red);
}

.blue{
  color:var(--blue);
}

.purple{
  color:var(--purple);
}

.green{
  color:var(--green);
}

.panel{
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.05);
}

.panelTitle{
  font-size:1.1rem;
  font-weight:900;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0 16px;
}

.tab{
  border:0;
  background:#f1f4f4;
  color:#546e7a;
  padding:9px 12px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background:var(--green-light);
  color:var(--green-dark);
}

.requestList{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.requestCard{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  background:#fff;
}

.requestTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.requestChild{
  font-size:1.02rem;
  font-weight:900;
}

.requestClass{
  margin-top:3px;
  color:var(--muted);
  font-size:.82rem;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:.76rem;
  font-weight:900;
  white-space:nowrap;
}

.badgePending{
  background:var(--yellow-light);
  color:#8d6e00;
}

.badgeApproved{
  background:var(--green-light);
  color:var(--green-dark);
}

.badgeRejected{
  background:var(--red-light);
  color:var(--red);
}

.badgeWaitlist{
  background:var(--orange-light);
  color:var(--orange);
}

.badgeOther{
  background:#eceff1;
  color:#546e7a;
}

.requestBody{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px 16px;
  margin-top:12px;
}

.info{
  font-size:.86rem;
  line-height:1.5;
}

.infoLabel{
  color:var(--muted);
  font-size:.76rem;
  margin-bottom:2px;
}

.infoValue{
  font-weight:700;
}

.reasonBox{
  margin-top:11px;
  padding:10px;
  border-radius:10px;
  background:#f7f9f9;
  line-height:1.55;
  font-size:.86rem;
}

.actionBox{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#fafcfc;
  border:1px solid #e5ebed;
}

.actionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.actionButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  border:1.5px dashed #b0bec5;
  border-radius:14px;
  background:#fafcfc;
  line-height:1.7;
}

.loading{
  padding:24px;
  text-align:center;
  color:var(--muted);
}

.errorBox{
  padding:14px;
  border-radius:12px;
  background:var(--red-light);
  color:#b71c1c;
  margin-bottom:14px;
  line-height:1.6;
  display:none;
}

@media(max-width:760px){

  .app{
    padding:12px;
  }

  .headerTop{
    flex-direction:column;
  }

  .summaryGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .loginGrid{
    grid-template-columns:1fr;
  }

  .requestBody,
  .actionGrid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="app">

<div class="header">

  <div class="headerTop">

    <div>

      <div class="brand">
        樂業附幼｜行政管理平台
      </div>

      <div class="subtitle">
        家長申請審核｜Supabase 第二版
      </div>

    </div>

    <button
      class="btn btnBlue"
      type="button"
      onclick="refreshRequests()"
    >
      ↻ 重新整理
    </button>

  </div>

  <div
    id="loginState"
    class="loginState"
  >
    Supabase：檢查登入狀態中...
  </div>

  <div class="testBox">

    <div class="testTitle">
      🧪 行政測試登入
    </div>

    <div class="helper">
      正式版之後會改由 LINE 自動驗證老師身分。
    </div>

    <div class="loginGrid">

      <input
        id="email"
        type="email"
        value="admin-test-0923@example.com"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="測試密碼"
      >

      <button
        id="loginBtn"
        class="btn btnGreen"
        onclick="login()"
      >
        登入
      </button>

    </div>

    <button
      class="btn btnGray"
      style="width:100%;margin-top:8px"
      onclick="logout()"
    >
      登出測試帳號
    </button>

  </div>

</div>


<div class="summaryGrid">

  <div class="summaryCard">
    <div class="summaryLabel">待處理申請</div>
    <div id="pendingCount" class="summaryNumber red">0</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">今日請假</div>
    <div id="leaveCount" class="summaryNumber blue">0</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">今日臨托</div>
    <div id="temporaryCount" class="summaryNumber purple">0</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">全部申請</div>
    <div id="allCount" class="summaryNumber green">0</div>
  </div>

</div>


<div class="panel">

  <div class="panelTitle">
    📋 家長申請紀錄
  </div>

  <div
    id="lastUpdated"
    class="helper"
  >
    尚未載入
  </div>

  <div
    id="errorBox"
    class="errorBox"
  ></div>

  <div class="tabs">

    <button
      id="tabAll"
      class="tab active"
      onclick="setFilter('all')"
    >
      全部
    </button>

    <button
      id="tabPending"
      class="tab"
      onclick="setFilter('pending')"
    >
      待處理
    </button>

    <button
      id="tabLeave"
      class="tab"
      onclick="setFilter('leave')"
    >
      請假
    </button>

    <button
      id="tabTemporary"
      class="tab"
      onclick="setFilter('temporary')"
    >
      臨時托育
    </button>

    <button
      id="tabExtended"
      class="tab"
      onclick="setFilter('extended')"
    >
      延長托育
    </button>

  </div>

  <div
    id="requestList"
    class="requestList"
  >
    <div class="empty">
      尚未登入行政帳號。
    </div>
  </div>

</div>

</div>


<script>

const SUPABASE_URL =
  "https://cqtvrpiapssjjctwqivn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PTpcF08CriR4_kH9KamB1w_akgHzTYw";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const CLASS_MAP = {
  C01:"櫻桃班",
  C02:"蘋果班",
  C03:"蝴蝶班",
  C04:"白兔班",
  C05:"蜜蜂班",
  C06:"袋鼠班",
  C07:"綿羊班",
  C08:"企鵝班"
};


const AFTERCARE_CLASSES = {

  AC01:{
    name:"蝴蝶班",
    group:"mixed",
    endTime:"18:00"
  },

  AC02:{
    name:"白兔班",
    group:"mixed",
    endTime:"17:00"
  },

  AC03:{
    name:"蜜蜂班",
    group:"mixed",
    endTime:"18:00"
  },

  AC04:{
    name:"陽光書屋班",
    group:"mixed",
    endTime:"17:00"
  },

  AC05:{
    name:"櫻桃班",
    group:"toddler",
    endTime:""
  },

  AC06:{
    name:"蘋果班",
    group:"toddler",
    endTime:""
  }

};


let currentUser =
  null;

let currentStaff =
  null;

let requests =
  [];

let childrenMap =
  {};

let currentFilter =
  "all";


const $ =
  id =>
  document.getElementById(id);


async function login(){

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(
    !email
    ||
    !password
  ){

    alert(
      "請輸入行政測試帳號與密碼。"
    );

    return;

  }

  $("loginBtn").disabled =
    true;

  hideError();

  await supabaseClient.auth.signOut();

  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    $("loginBtn").disabled =
      false;

    showError(
      "登入失敗：" +
      error.message
    );

    return;

  }

  currentUser =
    data.user;

  await validateAdmin();

  $("loginBtn").disabled =
    false;

}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser =
    null;

  currentStaff =
    null;

  requests =
    [];

  childrenMap =
    {};

  $("password").value =
    "";

  $("loginState").textContent =
    "Supabase：已登出";

  resetCounts();

  $("requestList").innerHTML =
    `
      <div class="empty">
        已登出行政測試帳號。
      </div>
    `;

}


async function validateAdmin(){

  if(
    !currentUser
  ){

    showError(
      "目前沒有登入中的 Supabase 使用者。"
    );

    return false;

  }

  $("loginState").textContent =
    "Supabase：正在驗證行政身分...";

  const {
    data:identity,
    error:identityError
  } =
    await supabaseClient
      .from("user_identities")
      .select("staff_id,guardian_id")
      .eq(
        "auth_user_id",
        currentUser.id
      )
      .maybeSingle();

  if(identityError){

    showError(
      "讀取身分對應失敗：" +
      identityError.message
    );

    return false;

  }

  if(
    !identity
    ||
    !identity.staff_id
  ){

    showError(
      "此帳號沒有綁定 staff 身分。"
    );

    return false;

  }

  const {
    data:staff,
    error:staffError
  } =
    await supabaseClient
      .from("staff")
      .select(
        "id,display_name,role,active"
      )
      .eq(
        "id",
        identity.staff_id
      )
      .maybeSingle();

  if(staffError){

    showError(
      "讀取 staff 失敗：" +
      staffError.message
    );

    return false;

  }

  if(
    !staff
    ||
    staff.active !== true
  ){

    showError(
      "此行政帳號不存在或已停用。"
    );

    return false;

  }

  if(
    staff.role !== "admin"
  ){

    showError(
      "目前此頁只開放 admin 行政角色。"
    );

    return false;

  }

  currentStaff =
    staff;

  $("loginState").innerHTML =
    "✅ Supabase 已登入<br>"
    +
    "帳號："
    +
    escapeHtml(
      currentUser.email || ""
    )
    +
    "<br>"
    +
    "身分："
    +
    escapeHtml(
      staff.display_name
    )
    +
    "｜"
    +
    escapeHtml(
      staff.role
    );

  hideError();

  await refreshRequests();

  return true;

}


async function refreshRequests(){

  if(
    !currentUser
    ||
    !currentStaff
  ){

    $("requestList").innerHTML =
      `
        <div class="empty">
          請先登入行政測試帳號。
        </div>
      `;

    return;

  }

  $("requestList").innerHTML =
    `
      <div class="loading">
        正在讀取家長申請...
      </div>
    `;

  hideError();

  const {
    data:requestData,
    error:requestError
  } =
    await supabaseClient
      .from("requests")
      .select(
        `
          id,
          request_date,
          child_id,
          guardian_id,
          request_type,
          status,
          requested_start_time,
          requested_end_time,
          reason,
          care_group,
          assigned_aftercare_class_code,
          admin_note,
          created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(requestError){

    showError(
      "讀取 requests 失敗：" +
      requestError.message
    );

    return;

  }

  requests =
    requestData || [];

  const childIds =
    [
      ...new Set(
        requests
          .map(
            r => r.child_id
          )
          .filter(Boolean)
      )
    ];

  childrenMap =
    {};

  if(childIds.length){

    const {
      data:childData,
      error:childError
    } =
      await supabaseClient
        .from("children")
        .select(
          `
            id,
            school_code,
            name,
            morning_class_id,
            care_group
          `
        )
        .in(
          "id",
          childIds
        );

    if(childError){

      showError(
        "幼兒資料讀取失敗：" +
        childError.message
      );

    }
    else{

      (childData || [])
        .forEach(

          child => {

            childrenMap[
              child.id
            ] =
              child;

          }

        );

    }

  }

  updateCounts();

  renderRequests();

  $("lastUpdated").textContent =
    "最後更新：" +
    formatDateTime(
      new Date()
    );

}


function updateCounts(){

  const today =
    localDateString(
      new Date()
    );

  $("pendingCount").textContent =
    requests.filter(
      r =>
      r.status === "pending"
    ).length;

  $("leaveCount").textContent =
    requests.filter(
      r =>
      r.request_type === "leave"
      &&
      r.request_date === today
    ).length;

  $("temporaryCount").textContent =
    requests.filter(
      r =>
      r.request_type === "temporary"
      &&
      r.request_date === today
    ).length;

  $("allCount").textContent =
    requests.length;

}


function resetCounts(){

  $("pendingCount").textContent =
    "0";

  $("leaveCount").textContent =
    "0";

  $("temporaryCount").textContent =
    "0";

  $("allCount").textContent =
    "0";

  $("lastUpdated").textContent =
    "尚未載入";

}


function setFilter(filter){

  currentFilter =
    filter;

  [
    "All",
    "Pending",
    "Leave",
    "Temporary",
    "Extended"
  ]
  .forEach(

    name => {

      const btn =
        $(
          "tab" +
          name
        );

      if(btn){

        btn.classList.remove(
          "active"
        );

      }

    }

  );

  const selected =
    $(
      "tab"
      +
      filter[0].toUpperCase()
      +
      filter.slice(1)
    );

  if(selected){

    selected.classList.add(
      "active"
    );

  }

  renderRequests();

}


function renderRequests(){

  let list =
    [...requests];

  if(
    currentFilter === "pending"
  ){

    list =
      list.filter(
        r =>
        r.status === "pending"
      );

  }

  if(
    currentFilter === "leave"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "leave"
      );

  }

  if(
    currentFilter === "temporary"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "temporary"
      );

  }

  if(
    currentFilter === "extended"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "extended"
      );

  }

  if(
    !list.length
  ){

    $("requestList").innerHTML =
      `
        <div class="empty">
          目前沒有符合條件的申請。
        </div>
      `;

    return;

  }

  $("requestList").innerHTML =
    list
      .map(
        requestCardHtml
      )
      .join("");

}


function requestCardHtml(r){

  const child =
    childrenMap[
      r.child_id
    ]
    ||
    null;

  const childName =
    child
    ?
    child.name
    :
    "未知幼兒";

  const className =
    child
    ?
    (
      CLASS_MAP[
        child.morning_class_id
      ]
      ||
      child.morning_class_id
      ||
      "未設定班級"
    )
    :
    "未設定班級";

  const schoolCode =
    child
    ?
    child.school_code
    :
    "";

  const status =
    statusText(
      r.status
    );

  const assignedClass =
    r.assigned_aftercare_class_code
    &&
    AFTERCARE_CLASSES[
      r.assigned_aftercare_class_code
    ]
    ?
    (
      r.assigned_aftercare_class_code
      +
      " "
      +
      AFTERCARE_CLASSES[
        r.assigned_aftercare_class_code
      ].name
    )
    :
    "尚未指派";

  return `

    <div class="requestCard">

      <div class="requestTop">

        <div>

          <div class="requestChild">
            ${escapeHtml(childName)}
          </div>

          <div class="requestClass">
            ${escapeHtml(className)}
            ${
              schoolCode
              ?
              "｜" +
              escapeHtml(schoolCode)
              :
              ""
            }
          </div>

        </div>

        <span
          class="badge ${statusClass(r.status)}"
        >
          ${escapeHtml(status)}
        </span>

      </div>


      <div class="requestBody">

        <div class="info">
          <div class="infoLabel">
            申請類型
          </div>
          <div class="infoValue">
            ${escapeHtml(requestTypeText(r.request_type))}
          </div>
        </div>

        <div class="info">
          <div class="infoLabel">
            日期
          </div>
          <div class="infoValue">
            ${escapeHtml(r.request_date || "-")}
          </div>
        </div>

        <div class="info">
          <div class="infoLabel">
            申請時段
          </div>
          <div class="infoValue">
            ${escapeHtml(requestTimeText(r))}
          </div>
        </div>

        <div class="info">
          <div class="infoLabel">
            托育類別
          </div>
          <div class="infoValue">
            ${escapeHtml(careGroupText(r.care_group))}
          </div>
        </div>

        <div class="info">
          <div class="infoLabel">
            本園安排課後班
          </div>
          <div class="infoValue">
            ${escapeHtml(assignedClass)}
          </div>
        </div>

        <div class="info">
          <div class="infoLabel">
            建立時間
          </div>
          <div class="infoValue">
            ${escapeHtml(formatDateTime(r.created_at))}
          </div>
        </div>

      </div>


      <div class="reasonBox">

        <b>📝 家長原因／備註</b>

        <br>

        ${escapeHtml(r.reason || "未填寫")}

      </div>


      ${
        r.admin_note
        ?
        `
          <div class="reasonBox">
            <b>🏫 本園備註</b>
            <br>
            ${escapeHtml(r.admin_note)}
          </div>
        `
        :
        ""
      }


      ${adminActionHtml(r)}

    </div>

  `;

}


function adminActionHtml(r){

  if(
    r.status !== "pending"
    &&
    r.status !== "waitlist"
  ){

    return `
      <div class="helper" style="margin-top:10px">
        此申請目前已完成行政處理。
      </div>
    `;

  }


  if(
    r.request_type === "leave"
  ){

    return `

      <div class="actionBox">

        <b>行政處理</b>

        <div class="actionButtons">

          <button
            class="btn btnGreen"
            onclick="updateRequestStatus(
              '${r.id}',
              'approved'
            )"
          >
            ✅ 確認收到請假
          </button>

        </div>

      </div>

    `;

  }


  if(
    r.request_type === "extended"
    ||
    r.request_type === "temporary"
  ){

    return `

      <div class="actionBox">

        <b>行政審核</b>

        <div class="actionGrid">

          <div>

            <div class="helper">
              本園安排課後班
            </div>

            <select
              id="class_${r.id}"
            >
              ${aftercareOptions(r)}
            </select>

          </div>

          <div>

            <div class="helper">
              本園備註（選填）
            </div>

            <input
              id="note_${r.id}"
              value="${escapeHtml(r.admin_note || "")}"
              placeholder="例：今日安排至蜜蜂班"
            >

          </div>

        </div>

        <div class="actionButtons">

          <button
            class="btn btnGreen"
            onclick="approveCareRequest(
              '${r.id}'
            )"
          >
            ✅ 核准
          </button>

          ${
            r.request_type === "temporary"
            ?
            `
              <button
                class="btn btnOrange"
                onclick="updateRequestStatus(
                  '${r.id}',
                  'waitlist'
                )"
              >
                🟡 候補
              </button>
            `
            :
            ""
          }

          <button
            class="btn btnRed"
            onclick="updateRequestStatus(
              '${r.id}',
              'rejected'
            )"
          >
            ❌ 無法安排
          </button>

        </div>

      </div>

    `;

  }


  return "";

}


function aftercareOptions(r){

  const child =
    childrenMap[
      r.child_id
    ];

  const careGroup =
    r.care_group
    ||
    child?.care_group
    ||
    "mixed";

  const needs18 =
    r.requested_end_time
    &&
    String(
      r.requested_end_time
    ).startsWith(
      "18:00"
    );

  const items =
    Object.entries(
      AFTERCARE_CLASSES
    )
    .filter(

      ([code,item]) => {

        if(
          item.group !==
          careGroup
        ){
          return false;
        }

        if(
          careGroup === "mixed"
          &&
          needs18
          &&
          item.endTime !== "18:00"
        ){
          return false;
        }

        return true;

      }

    );

  let html =
    `<option value="">請選擇課後班</option>`;

  items.forEach(

    ([code,item]) => {

      const selected =
        r.assigned_aftercare_class_code === code
        ?
        "selected"
        :
        "";

      html +=
        `
          <option
            value="${code}"
            ${selected}
          >
            ${code} ${escapeHtml(item.name)}
            ${
              item.endTime
              ?
              "｜至 " +
              item.endTime
              :
              ""
            }
          </option>
        `;

    }

  );

  return html;

}


async function approveCareRequest(
  requestId
){

  const classEl =
    $(
      "class_" +
      requestId
    );

  const noteEl =
    $(
      "note_" +
      requestId
    );

  const classCode =
    classEl
    ?
    classEl.value
    :
    "";

  const adminNote =
    noteEl
    ?
    noteEl.value.trim()
    :
    "";

  if(
    !classCode
  ){

    alert(
      "核准前請先選擇本園安排的課後班。"
    );

    return;

  }

  if(
    !confirm(
      "確定要核准此申請？"
    )
  ){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("requests")
      .update(
        {
          status:
            "approved",

          assigned_aftercare_class_code:
            classCode,

          admin_note:
            adminNote
        }
      )
      .eq(
        "id",
        requestId
      );

  if(error){

    alert(
      "核准失敗：\n\n" +
      error.message
    );

    return;

  }

  alert(
    "✅ 已核准並完成課後班指派。"
  );

  await refreshRequests();

}


async function updateRequestStatus(
  requestId,
  newStatus
){

  let confirmText =
    "確定要更新此申請嗎？";

  if(
    newStatus === "approved"
  ){
    confirmText =
      "確定已收到並確認這筆請假嗎？";
  }

  if(
    newStatus === "waitlist"
  ){
    confirmText =
      "確定將此申請設為候補嗎？";
  }

  if(
    newStatus === "rejected"
  ){
    confirmText =
      "確定此申請無法安排嗎？";
  }

  if(
    !confirm(
      confirmText
    )
  ){
    return;
  }

  const noteEl =
    $(
      "note_" +
      requestId
    );

  const adminNote =
    noteEl
    ?
    noteEl.value.trim()
    :
    null;

  const payload = {
    status:
      newStatus
  };

  if(
    adminNote !== null
  ){

    payload.admin_note =
      adminNote;

  }

  if(
    newStatus !== "approved"
  ){

    payload.assigned_aftercare_class_code =
      null;

  }

  const {
    error
  } =
    await supabaseClient
      .from("requests")
      .update(
        payload
      )
      .eq(
        "id",
        requestId
      );

  if(error){

    alert(
      "狀態更新失敗：\n\n"
      +
      error.message
    );

    return;

  }

  alert(
    "✅ 狀態已更新為「"
    +
    statusText(
      newStatus
    )
    +
    "」。"
  );

  await refreshRequests();

}


function requestTimeText(r){

  if(
    !r.requested_start_time
    &&
    !r.requested_end_time
  ){
    return "-";
  }

  return (
    shortTime(
      r.requested_start_time
    )
    +
    (
      r.requested_end_time
      ?
      " → " +
      shortTime(
        r.requested_end_time
      )
      :
      ""
    )
  );

}


function shortTime(value){

  if(!value){
    return "";
  }

  return String(value)
    .slice(
      0,
      5
    );

}


function requestTypeText(type){

  const map = {
    leave:"今日請假",
    temporary:"臨時托育",
    extended:"延長托育",
    pickup:"接送通知",
    late:"晚到通報"
  };

  return (
    map[type]
    ||
    type
    ||
    "未知"
  );

}


function statusText(status){

  const map = {
    pending:"待處理",
    approved:"已核准",
    rejected:"無法安排",
    waitlist:"候補",
    cancelled:"已取消"
  };

  return (
    map[status]
    ||
    status
    ||
    "未知"
  );

}


function statusClass(status){

  if(
    status === "pending"
  ){
    return "badgePending";
  }

  if(
    status === "approved"
  ){
    return "badgeApproved";
  }

  if(
    status === "rejected"
  ){
    return "badgeRejected";
  }

  if(
    status === "waitlist"
  ){
    return "badgeWaitlist";
  }

  return "badgeOther";

}


function careGroupText(value){

  if(
    value === "mixed"
  ){
    return "混齡";
  }

  if(
    value === "toddler"
  ){
    return "幼幼";
  }

  return value || "-";

}


function localDateString(date){

  const d =
    new Date(
      date
    );

  return (
    d.getFullYear()
    +
    "-"
    +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    )
    +
    "-"
    +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function formatDateTime(value){

  if(
    !value
  ){
    return "-";
  }

  const d =
    new Date(
      value
    );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return String(
      value
    );

  }

  return (
    d.getFullYear()
    +
    "/"
    +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    )
    +
    "/"
    +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )
    +
    " "
    +
    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    )
    +
    ":"
    +
    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    )
  );

}


function showError(text){

  $("errorBox").textContent =
    text;

  $("errorBox").style.display =
    "block";

}


function hideError(){

  $("errorBox").textContent =
    "";

  $("errorBox").style.display =
    "none";

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


async function restoreSession(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if(error){

    $("loginState").textContent =
      "Supabase：讀取登入狀態失敗";

    return;

  }

  if(
    !data
    ||
    !data.session
    ||
    !data.session.user
  ){

    $("loginState").textContent =
      "Supabase：尚未登入行政測試帳號";

    return;

  }

  currentUser =
    data.session.user;

  await validateAdmin();

}


async function main(){

  await restoreSession();

}


main();

</script>
