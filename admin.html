<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>樂業附幼｜行政管理平台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

  --green:#2e7d32;
  --green-dark:#1b5e20;
  --green-light:#e8f5e9;

  --blue:#1976d2;
  --blue-light:#e3f2fd;

  --orange:#ef6c00;
  --orange-light:#fff3e0;

  --purple:#7b1fa2;
  --purple-light:#f3e5f5;

  --red:#d32f2f;
  --red-light:#ffebee;

  --yellow:#f9a825;
  --yellow-light:#fff8e1;

  --gray:#607d8b;

  --text:#263238;
  --muted:#78909c;
  --line:#dfe7e9;
  --bg:#f3f6f5;

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Roboto,
    sans-serif;

}


.app{

  max-width:1200px;
  margin:auto;

  padding:
    18px;

}


.header{

  background:#fff;

  border-radius:20px;

  padding:
    20px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.06);

  margin-bottom:16px;

}


.headerTop{

  display:flex;

  align-items:flex-start;

  justify-content:
    space-between;

  gap:14px;

}


.brand{

  font-size:1.35rem;

  font-weight:900;

  color:
    var(--green-dark);

}


.subtitle{

  margin-top:5px;

  color:
    var(--muted);

  font-size:.9rem;

  line-height:1.55;

}


.loginState{

  margin-top:14px;

  padding:12px;

  background:
    var(--green-light);

  border-radius:12px;

  color:
    var(--green-dark);

  font-size:.9rem;

  line-height:1.6;

}


.testBox{

  margin-top:14px;

  padding:14px;

  background:
    var(--yellow-light);

  border:
    1px solid
    #ffe0b2;

  border-radius:13px;

}


.testTitle{

  font-weight:900;

  color:#8d6e00;

  margin-bottom:8px;

}


.helper{

  font-size:.8rem;

  color:
    var(--muted);

  line-height:1.55;

  margin-top:6px;

}


input,
select{

  width:100%;

  padding:12px;

  border:
    1.5px solid
    #cfd8dc;

  border-radius:11px;

  font-size:16px;

  font-family:inherit;

  outline:none;

  background:#fff;

}


input:focus,
select:focus{

  border-color:#81c784;

}


.loginGrid{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    auto;

  gap:8px;

  margin-top:10px;

}


button{

  font-family:inherit;

}


.btn{

  border:0;

  border-radius:11px;

  padding:
    12px
    16px;

  font-weight:900;

  cursor:pointer;

  font-size:.9rem;

}


.btn:disabled{

  opacity:.55;

  cursor:not-allowed;

}


.btnGreen{

  background:
    var(--green);

  color:#fff;

}


.btnGray{

  background:
    var(--gray);

  color:#fff;

}


.btnBlue{

  background:
    var(--blue);

  color:#fff;

}


.summaryGrid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-bottom:16px;

}


.summaryCard{

  background:#fff;

  border-radius:16px;

  padding:16px;

  box-shadow:
    0 6px 18px
    rgba(0,0,0,.05);

}


.summaryLabel{

  color:
    var(--muted);

  font-size:.82rem;

  font-weight:700;

}


.summaryNumber{

  margin-top:5px;

  font-size:1.7rem;

  font-weight:900;

}


.summaryNumber.red{

  color:
    var(--red);

}


.summaryNumber.blue{

  color:
    var(--blue);

}


.summaryNumber.purple{

  color:
    var(--purple);

}


.summaryNumber.green{

  color:
    var(--green);

}


.panel{

  background:#fff;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.05);

}


.panelTop{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:10px;

  margin-bottom:14px;

}


.panelTitle{

  font-size:1.1rem;

  font-weight:900;

}


.toolbar{

  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;

}


.tabs{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

  margin-bottom:16px;

}


.tab{

  border:0;

  background:#f1f4f4;

  color:#546e7a;

  padding:
    9px
    12px;

  border-radius:999px;

  font-weight:800;

  cursor:pointer;

}


.tab.active{

  background:
    var(--green-light);

  color:
    var(--green-dark);

}


.requestList{

  display:flex;

  flex-direction:column;

  gap:10px;

}


.requestCard{

  border:
    1px solid
    var(--line);

  border-radius:14px;

  padding:14px;

  background:#fff;

}


.requestTop{

  display:flex;

  align-items:flex-start;

  justify-content:
    space-between;

  gap:10px;

}


.requestChild{

  font-size:1rem;

  font-weight:900;

}


.requestClass{

  margin-top:3px;

  color:
    var(--muted);

  font-size:.82rem;

}


.badge{

  display:inline-block;

  padding:
    5px
    9px;

  border-radius:999px;

  font-size:.76rem;

  font-weight:900;

  white-space:nowrap;

}


.badgePending{

  background:
    var(--yellow-light);

  color:#8d6e00;

}


.badgeApproved{

  background:
    var(--green-light);

  color:
    var(--green-dark);

}


.badgeRejected{

  background:
    var(--red-light);

  color:
    var(--red);

}


.badgeWaitlist{

  background:
    var(--orange-light);

  color:
    var(--orange);

}


.badgeOther{

  background:#eceff1;

  color:#546e7a;

}


.requestBody{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:
    8px
    16px;

  margin-top:12px;

}


.info{

  font-size:.86rem;

  line-height:1.55;

}


.infoLabel{

  color:
    var(--muted);

  font-size:.77rem;

  margin-bottom:2px;

}


.infoValue{

  font-weight:700;

  word-break:
    break-word;

}


.reasonBox{

  margin-top:11px;

  padding:10px;

  border-radius:10px;

  background:#f7f9f9;

  line-height:1.55;

  font-size:.86rem;

}


.empty{

  padding:28px;

  text-align:center;

  color:
    var(--muted);

  border:
    1.5px dashed
    #b0bec5;

  border-radius:14px;

  background:#fafcfc;

  line-height:1.7;

}


.loading{

  padding:24px;

  text-align:center;

  color:
    var(--muted);

}


.errorBox{

  padding:14px;

  border-radius:12px;

  background:
    var(--red-light);

  color:
    #b71c1c;

  margin-bottom:14px;

  line-height:1.6;

  display:none;

}


.hidden{

  display:none!important;

}


@media(
  max-width:760px
){

  .app{
    padding:12px;
  }


  .headerTop{
    flex-direction:column;
  }


  .summaryGrid{

    grid-template-columns:
      repeat(2,1fr);

  }


  .loginGrid{

    grid-template-columns:
      1fr;

  }


  .requestBody{

    grid-template-columns:
      1fr;

  }


  .panelTop{

    align-items:flex-start;

    flex-direction:column;

  }

}

</style>

</head>


<body>

<div class="app">


<!-- ====================================== -->
<!-- 頁首 -->
<!-- ====================================== -->

<div class="header">

  <div class="headerTop">

    <div>

      <div class="brand">
        樂業附幼｜行政管理平台
      </div>

      <div class="subtitle">
        Supabase 第一版｜讀取家長真實申請資料
      </div>

    </div>


    <button
      class="btn btnBlue"
      type="button"
      onclick="refreshRequests()"
    >
      ↻ 重新整理
    </button>

  </div>


  <div
    id="loginState"
    class="loginState"
  >
    Supabase：檢查登入狀態中...
  </div>


  <!-- ====================================== -->
  <!-- 測試登入 -->
  <!-- 正式老師 LINE 身分完成後移除 -->
  <!-- ====================================== -->

  <div
    id="testLoginBox"
    class="testBox"
  >

    <div class="testTitle">
      🧪 行政測試登入
    </div>

    <div class="helper">
      正式上線後會改為老師從 LINE 進入並自動驗證身分，不會要求老師使用這組測試帳號。
    </div>


    <div class="loginGrid">

      <input
        id="email"
        type="email"
        value="admin-test-0923@example.com"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="測試密碼"
      >

      <button
        id="loginBtn"
        class="btn btnGreen"
        type="button"
        onclick="login()"
      >
        登入
      </button>

    </div>


    <button
      class="btn btnGray"
      type="button"
      style="
        margin-top:8px;
        width:100%;
      "
      onclick="logout()"
    >
      登出測試帳號
    </button>

  </div>

</div>



<!-- ====================================== -->
<!-- 統計 -->
<!-- ====================================== -->

<div class="summaryGrid">

  <div class="summaryCard">

    <div class="summaryLabel">
      待處理申請
    </div>

    <div
      id="pendingCount"
      class="summaryNumber red"
    >
      0
    </div>

  </div>


  <div class="summaryCard">

    <div class="summaryLabel">
      今日請假
    </div>

    <div
      id="leaveCount"
      class="summaryNumber blue"
    >
      0
    </div>

  </div>


  <div class="summaryCard">

    <div class="summaryLabel">
      今日臨托
    </div>

    <div
      id="temporaryCount"
      class="summaryNumber purple"
    >
      0
    </div>

  </div>


  <div class="summaryCard">

    <div class="summaryLabel">
      全部申請
    </div>

    <div
      id="allCount"
      class="summaryNumber green"
    >
      0
    </div>

  </div>

</div>



<!-- ====================================== -->
<!-- 申請列表 -->
<!-- ====================================== -->

<div class="panel">

  <div class="panelTop">

    <div>

      <div class="panelTitle">
        📋 家長申請紀錄
      </div>

      <div
        id="lastUpdated"
        class="helper"
      >
        尚未載入
      </div>

    </div>

  </div>


  <div
    id="errorBox"
    class="errorBox"
  ></div>


  <div class="tabs">

    <button
      id="tabAll"
      class="tab active"
      type="button"
      onclick="setFilter('all')"
    >
      全部
    </button>

    <button
      id="tabPending"
      class="tab"
      type="button"
      onclick="setFilter('pending')"
    >
      待處理
    </button>

    <button
      id="tabLeave"
      class="tab"
      type="button"
      onclick="setFilter('leave')"
    >
      請假
    </button>

    <button
      id="tabTemporary"
      class="tab"
      type="button"
      onclick="setFilter('temporary')"
    >
      臨時托育
    </button>

    <button
      id="tabExtended"
      class="tab"
      type="button"
      onclick="setFilter('extended')"
    >
      延長托育
    </button>

  </div>


  <div
    id="requestList"
    class="requestList"
  >

    <div class="empty">
      尚未登入行政帳號。
    </div>

  </div>

</div>


</div>



<script>

/*
==================================================
Supabase
==================================================
*/

const SUPABASE_URL =
  "https://cqtvrpiapssjjctwqivn.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PTpcF08CriR4_kH9KamB1w_akgHzTYw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/*
==================================================
上午班級
==================================================
*/

const CLASS_MAP = {

  C01:"櫻桃班",

  C02:"蘋果班",

  C03:"蝴蝶班",

  C04:"白兔班",

  C05:"蜜蜂班",

  C06:"袋鼠班",

  C07:"綿羊班",

  C08:"企鵝班"

};



/*
==================================================
狀態
==================================================
*/

let currentUser =
  null;


let currentStaff =
  null;


let requests =
  [];


let childrenMap =
  {};


let currentFilter =
  "all";


const $ =
  id =>
  document.getElementById(id);



/*
==================================================
登入
==================================================
*/

async function login(){

  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  if(
    !email
    ||
    !password
  ){

    alert(
      "請輸入行政測試帳號與密碼。"
    );


    return;

  }


  $("loginBtn").disabled =
    true;


  $("loginState").textContent =
    "Supabase：登入中...";


  hideError();


  /*
  先清除舊 session
  */

  await supabaseClient.auth.signOut();


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword(
      {
        email,
        password
      }
    );


  if(
    error
  ){

    $("loginBtn").disabled =
      false;


    $("loginState").textContent =
      "Supabase：登入失敗";


    showError(
      "登入失敗：" +
      error.message
    );


    return;

  }


  currentUser =
    data.user;


  await validateAdmin();


  $("loginBtn").disabled =
    false;

}



/*
==================================================
登出
==================================================
*/

async function logout(){

  await supabaseClient.auth.signOut();


  currentUser =
    null;


  currentStaff =
    null;


  requests =
    [];


  childrenMap =
    {};


  $("password").value =
    "";


  $("loginState").textContent =
    "Supabase：已登出";


  resetCounts();


  $("requestList").innerHTML =

    `
      <div class="empty">
        已登出行政測試帳號。
      </div>
    `;

}



/*
==================================================
驗證行政身分
==================================================
*/

async function validateAdmin(){

  if(
    !currentUser
  ){

    showError(
      "目前沒有登入中的 Supabase 使用者。"
    );


    return false;

  }


  $("loginState").textContent =
    "Supabase：正在驗證行政身分...";


  /*
  先讀自己的 user_identities
  */

  const {
    data:identity,
    error:identityError
  } =
    await supabaseClient
      .from(
        "user_identities"
      )
      .select(
        "staff_id,guardian_id"
      )
      .eq(
        "auth_user_id",
        currentUser.id
      )
      .maybeSingle();


  if(
    identityError
  ){

    showError(
      "讀取身分對應失敗：" +
      identityError.message
    );


    return false;

  }


  if(
    !identity
    ||
    !identity.staff_id
  ){

    $("loginState").textContent =
      "此帳號不是老師／行政帳號";


    showError(
      "此 Supabase 帳號沒有綁定 staff 身分。"
    );


    return false;

  }


  /*
  讀 staff
  */

  const {
    data:staff,
    error:staffError
  } =
    await supabaseClient
      .from(
        "staff"
      )
      .select(
        "id,display_name,role,active"
      )
      .eq(
        "id",
        identity.staff_id
      )
      .maybeSingle();


  if(
    staffError
  ){

    showError(
      "讀取 staff 資料失敗：" +
      staffError.message
    );


    return false;

  }


  if(
    !staff
  ){

    showError(
      "找不到對應的 staff 資料。"
    );


    return false;

  }


  if(
    staff.active !== true
  ){

    showError(
      "此老師帳號目前已停用。"
    );


    return false;

  }


  if(
    staff.role !== "admin"
  ){

    $("loginState").textContent =
      "此帳號不是行政權限";


    showError(
      "目前第一版 admin.html 僅開放 admin 行政角色。"
    );


    return false;

  }


  currentStaff =
    staff;


  $("loginState").innerHTML =

    "✅ Supabase 已登入<br>"
    +
    "帳號："
    +
    escapeHtml(
      currentUser.email
      ||
      ""
    )
    +
    "<br>"
    +
    "身分："
    +
    escapeHtml(
      staff.display_name
    )
    +
    "｜"
    +
    escapeHtml(
      staff.role
    );


  hideError();


  await refreshRequests();


  return true;

}



/*
==================================================
重新整理
==================================================
*/

async function refreshRequests(){

  if(
    !currentUser
    ||
    !currentStaff
  ){

    $("requestList").innerHTML =

      `
        <div class="empty">
          請先登入行政測試帳號。
        </div>
      `;


    return;

  }


  $("requestList").innerHTML =

    `
      <div class="loading">
        正在從 Supabase 讀取家長申請...
      </div>
    `;


  hideError();


  /*
  requests RLS：
  admin 應可讀全部
  */

  const {
    data:requestData,
    error:requestError
  } =
    await supabaseClient
      .from(
        "requests"
      )
      .select(
        `
          id,
          request_date,
          child_id,
          guardian_id,
          request_type,
          status,
          requested_start_time,
          requested_end_time,
          reason,
          care_group,
          created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(
    requestError
  ){

    showError(
      "讀取 requests 失敗：" +
      requestError.message
    );


    $("requestList").innerHTML =

      `
        <div class="empty">
          requests 資料讀取失敗。
        </div>
      `;


    return;

  }


  requests =
    requestData
    ||
    [];


  /*
  收集 child_id
  */

  const childIds =

    [
      ...new Set(

        requests
          .map(
            r =>
            r.child_id
          )
          .filter(Boolean)

      )
    ];


  childrenMap =
    {};


  if(
    childIds.length
  ){

    const {
      data:childData,
      error:childError
    } =
      await supabaseClient
        .from(
          "children"
        )
        .select(
          `
            id,
            school_code,
            name,
            morning_class_id,
            care_group
          `
        )
        .in(
          "id",
          childIds
        );


    if(
      childError
    ){

      showError(
        "申請已讀取，但幼兒資料讀取失敗：" +
        childError.message
      );

    }
    else{

      (
        childData
        ||
        []
      )
      .forEach(

        child => {

          childrenMap[
            child.id
          ] =
            child;

        }

      );

    }

  }


  updateCounts();


  renderRequests();


  $("lastUpdated").textContent =
    "最後更新：" +
    formatDateTime(
      new Date()
    );

}



/*
==================================================
統計
==================================================
*/

function updateCounts(){

  const today =
    localDateString(
      new Date()
    );


  const pending =

    requests.filter(
      r =>
      r.status === "pending"
    ).length;


  const leave =

    requests.filter(

      r =>
      r.request_type === "leave"
      &&
      r.request_date === today

    ).length;


  const temporary =

    requests.filter(

      r =>
      r.request_type === "temporary"
      &&
      r.request_date === today

    ).length;


  $("pendingCount").textContent =
    pending;


  $("leaveCount").textContent =
    leave;


  $("temporaryCount").textContent =
    temporary;


  $("allCount").textContent =
    requests.length;

}


function resetCounts(){

  $("pendingCount").textContent =
    "0";


  $("leaveCount").textContent =
    "0";


  $("temporaryCount").textContent =
    "0";


  $("allCount").textContent =
    "0";


  $("lastUpdated").textContent =
    "尚未載入";

}



/*
==================================================
篩選
==================================================
*/

function setFilter(filter){

  currentFilter =
    filter;


  [
    "All",
    "Pending",
    "Leave",
    "Temporary",
    "Extended"
  ]
  .forEach(

    name => {

      const btn =
        $(
          "tab"
          +
          name
        );


      if(
        btn
      ){

        btn.classList.remove(
          "active"
        );

      }

    }

  );


  const selected =
    $(
      "tab"
      +
      filter[0].toUpperCase()
      +
      filter.slice(1)
    );


  if(
    selected
  ){

    selected.classList.add(
      "active"
    );

  }


  renderRequests();

}



/*
==================================================
顯示 requests
==================================================
*/

function renderRequests(){

  let list =
    [
      ...requests
    ];


  if(
    currentFilter === "pending"
  ){

    list =
      list.filter(
        r =>
        r.status === "pending"
      );

  }


  if(
    currentFilter === "leave"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "leave"
      );

  }


  if(
    currentFilter === "temporary"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "temporary"
      );

  }


  if(
    currentFilter === "extended"
  ){

    list =
      list.filter(
        r =>
        r.request_type === "extended"
      );

  }


  if(
    !list.length
  ){

    $("requestList").innerHTML =

      `
        <div class="empty">
          目前沒有符合條件的申請。
        </div>
      `;


    return;

  }


  $("requestList").innerHTML =

    list
      .map(
        requestCardHtml
      )
      .join("");

}



/*
==================================================
單筆卡片
==================================================
*/

function requestCardHtml(r){

  const child =
    childrenMap[
      r.child_id
    ]
    ||
    null;


  const childName =
    child
    ?
    child.name
    :
    "未知幼兒";


  const classId =
    child
    ?
    child.morning_class_id
    :
    "";


  const className =
    CLASS_MAP[
      classId
    ]
    ||
    classId
    ||
    "未設定班級";


  const schoolCode =
    child
    ?
    child.school_code
    :
    "";


  const requestType =
    requestTypeText(
      r.request_type
    );


  const status =
    statusText(
      r.status
    );


  const badgeClass =
    statusClass(
      r.status
    );


  let timeText =
    "-";


  if(
    r.requested_start_time
    ||
    r.requested_end_time
  ){

    timeText =

      (
        r.requested_start_time
        ||
        ""
      )

      +

      (
        r.requested_end_time
        ?

        " → "
        +
        r.requested_end_time

        :

        ""
      );

  }


  return `

    <div class="requestCard">

      <div class="requestTop">

        <div>

          <div class="requestChild">
            ${escapeHtml(childName)}
          </div>

          <div class="requestClass">
            ${escapeHtml(className)}
            ${
              schoolCode
              ?
              "｜" +
              escapeHtml(schoolCode)
              :
              ""
            }
          </div>

        </div>


        <span
          class="badge ${badgeClass}"
        >
          ${escapeHtml(status)}
        </span>

      </div>


      <div class="requestBody">


        <div class="info">

          <div class="infoLabel">
            申請類型
          </div>

          <div class="infoValue">
            ${escapeHtml(requestType)}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            日期
          </div>

          <div class="infoValue">
            ${escapeHtml(r.request_date || "-")}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            申請時段
          </div>

          <div class="infoValue">
            ${escapeHtml(timeText)}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            托育類別
          </div>

          <div class="infoValue">
            ${escapeHtml(careGroupText(r.care_group))}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            建立時間
          </div>

          <div class="infoValue">
            ${escapeHtml(formatDateTime(r.created_at))}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            Request ID
          </div>

          <div
            class="infoValue"
            style="
              font-size:.72rem;
              font-weight:500;
            "
          >
            ${escapeHtml(r.id)}
          </div>

        </div>

      </div>


      <div class="reasonBox">

        <b>📝 原因／備註</b>

        <br>

        ${
          escapeHtml(
            r.reason
            ||
            "未填寫"
          )
        }

      </div>


      <div
        class="helper"
        style="
          margin-top:10px;
        "
      >
        第一版目前僅供查看。核准、候補、退回與課後班指派會在下一階段加入。
      </div>

    </div>

  `;

}



/*
==================================================
文字轉換
==================================================
*/

function requestTypeText(type){

  const map = {

    leave:
      "今日請假",

    temporary:
      "臨時托育",

    extended:
      "延長托育",

    pickup:
      "接送通知",

    late:
      "晚到通報"

  };


  return (
    map[type]
    ||
    type
    ||
    "未知"
  );

}


function statusText(status){

  const map = {

    pending:
      "待處理",

    approved:
      "已核准",

    rejected:
      "無法安排",

    waitlist:
      "候補",

    cancelled:
      "已取消"

  };


  return (
    map[status]
    ||
    status
    ||
    "未知"
  );

}


function statusClass(status){

  if(
    status === "pending"
  ){
    return "badgePending";
  }


  if(
    status === "approved"
  ){
    return "badgeApproved";
  }


  if(
    status === "rejected"
  ){
    return "badgeRejected";
  }


  if(
    status === "waitlist"
  ){
    return "badgeWaitlist";
  }


  return "badgeOther";

}


function careGroupText(value){

  if(
    value === "mixed"
  ){
    return "混齡";
  }


  if(
    value === "toddler"
  ){
    return "幼幼";
  }


  return (
    value
    ||
    "-"
  );

}



/*
==================================================
時間格式
==================================================
*/

function localDateString(date){

  const d =
    new Date(
      date
    );


  return (
    d.getFullYear()
    +
    "-"
    +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    )
    +
    "-"
    +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


function formatDateTime(value){

  if(
    !value
  ){
    return "-";
  }


  const d =
    value instanceof Date
    ?
    value
    :
    new Date(
      value
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return String(
      value
    );

  }


  return (

    d.getFullYear()

    +

    "/"

    +

    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )

    +

    " "

    +

    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    )

  );

}

  $("errorBox").textContent =

  $("errorBox").style.display =
    "block";

function hideError(){

  $("errorBox").textContent =
    "";

}



/*
==================================================
HTML escape
==================================================
*/

function escapeHtml(value){

  return String(
    value
    ??
    ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/*
==================================================
恢復 session
==================================================
*/

async function restoreSession(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(
    error
  ){

    $("loginState").textContent =
      "Supabase：讀取登入狀態失敗";


    return;

  }


  if(
    !data
    ||
    !data.session
    ||
    !data.session.user
  ){

    $("loginState").textContent =
      "Supabase：尚未登入行政測試帳號";


    return;

  }


  currentUser =
    data.session.user;


  await validateAdmin();

}

初始化

*/

async function main(){

  await restoreSession();

}
