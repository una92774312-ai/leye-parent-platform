async function login(){

/*
==================================================
驗證行政身分
==================================================
*/

async function validateAdmin(){

  if(
    !currentUser
  ){

    showError(
      "目前沒有登入中的 Supabase 使用者。"
    );

    return false;

  }


  $("loginState").textContent =
    "Supabase：正在驗證行政身分...";


  const {
    data:identity,
    error:identityError
  } =
    await supabaseClient
      .from("user_identities")
      .select(
        "staff_id,guardian_id"
      )
      .eq(
        "auth_user_id",
        currentUser.id
      )
      .maybeSingle();


  if(
    identityError
  ){

    showError(
      "讀取身分對應失敗："
      +
      identityError.message
    );

    return false;

  }


  if(
    !identity
    ||
    !identity.staff_id
  ){

    showError(
      "此帳號沒有綁定 staff 身分。"
    );

    return false;

  }


  const {
    data:staff,
    error:staffError
  } =
    await supabaseClient
      .from("staff")
      .select(
        "id,display_name,role,active"
      )
      .eq(
        "id",
        identity.staff_id
      )
      .maybeSingle();


  if(
    staffError
  ){

    showError(
      "讀取 staff 失敗："
      +
      staffError.message
    );

    return false;

  }


  if(
    !staff
    ||
    staff.active !== true
  ){

    showError(
      "此行政帳號不存在或已停用。"
    );

    return false;

  }


  if(
    staff.role !== "admin"
  ){

    showError(
      "目前此頁只開放 admin 行政角色。"
    );

    return false;

  }


  currentStaff =

  $("loginState").innerHTML =

    +

      staff.role
    );


  hideError();


  await refreshAll();


  return true;

}

/*
==================================================
取得台灣日期 YYYY-MM-DD
==================================================
*/

function getTaiwanDateString(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Taipei",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    )
    .formatToParts(
      new Date()
    );


  const map =
    {};


  parts.forEach(
    part => {

      if(
        part.type !== "literal"
      ){

        map[
          part.type
        ] =
          part.value;

      }

    }
  );


  return (
    map.year
    +
    "-"
    +
    map.month
    +
    "-"
    +
    map.day
  );

}


/*
==================================================
時間格式
==================================================
*/

function formatClockTime(
  value
){

  if(
    !value
  ){

    return "—";

  }


  const text =
    String(value);


  if(
    text.includes("T")
  ){

    try{

      return new Intl.DateTimeFormat(
        "zh-TW",
        {
          timeZone:"Asia/Taipei",
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      )
      .format(
        new Date(text)
      );

    }
    catch(e){

      return text;

    }

  }


  return text.substring(
    0,
    5
  );

}


/*
==================================================
日期時間格式
==================================================
*/

function formatDateTime(
  value
){

  if(
    !value
  ){

    return "—";

  }


  try{

    return new Intl.DateTimeFormat(
      "zh-TW",
      {
        timeZone:"Asia/Taipei",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    )
    .format(
      new Date(value)
    );

  }
  catch(e){

    return String(value);

  }

}

      "第二梯 18:00",

    early:
      "提早接孩子",

    late_notice:
      "我會晚到"

  };


  return (

    mode
    ||
    "—"
  );

}


/*
==================================================
接送狀態中文
==================================================
*/

function pickupStatusText(
  status
){

  const map = {

    waiting:
      "等待接送",

    on_time:
      "正常完成",

    delayed_pickup:
      "延遲接回",

    late_pickup:
      "逾時接送"

  };


  return (
    map[
      status
    ]
    ||
    status
    ||
    "—"
  );

}


/*
==================================================
接送狀態 Badge
==================================================
*/

function pickupStatusBadge(
  status
){

  if(
    status === "waiting"
  ){

    return (
      '<span class="badge badgePending">'
      +
      "等待接送"
      +
      "</span>"
    );

  }


  if(
    status === "on_time"
  ){

    return (
      '<span class="badge badgeApproved">'
      +
      "正常完成"
      +
      "</span>"
    );

  }


  if(
    status === "delayed_pickup"
  ){

    return (
      '<span class="badge badgeWaitlist">'
      +
      "延遲接回"
      +
      "</span>"
    );

  }


  if(
    status === "late_pickup"
  ){

    return (
      '<span class="badge badgeRejected">'
      +
      "逾時接送"
      +
      "</span>"
    );

  }


  return (
    '<span class="badge badgeOther">'
    +
    escapeHtml(
      status || "未知"
    )
    +
    "</span>"
  );

}

/*
==================================================
取得班級名稱
==================================================
*/

function getPickupClassName(
  child,
  pickupClassMap
){

  if(
    !child
  ){

    return "—";

  }


  const classRow =
    pickupClassMap[
      child.morning_class_id
    ];


  if(
    classRow
  ){

    if(
      classRow.name
    ){

      return classRow.name;

    }


    if(
      classRow.class_name
    ){

      return classRow.class_name;

    }


    if(
      classRow.code
      &&
      CLASS_MAP[
        classRow.code
      ]
    ){

      return CLASS_MAP[
        classRow.code
      ];

    }


    if(
      classRow.class_code
      &&
      CLASS_MAP[
        classRow.class_code
      ]
    ){

      return CLASS_MAP[
        classRow.class_code
      ];

    }

  }


  return "原班級";

}

/*
==================================================
完成接送
==================================================
*/

async function completePickupRecord(
  pickupRecordId
){

  if(
    !pickupRecordId
  ){

    return;

  }


  const record =
    pickupRecords
      .find(
        row =>
        row.id
        ===
        pickupRecordId
      );


  if(
    !record
  ){

    alert(
      "找不到這筆接送資料。"
    );

    return;

  }


  if(
    record.actual_pickup_at
  ){

    alert(
      "這筆接送已經完成。"
    );

    return;

  }


  const ok =
    confirm(
      "確定孩子已完成接送嗎？\n\n"
      +
      "系統將以現在時間作為正式完成接送時間，"
      +
      "並自動判斷是否延遲、逾時及相關費用。"
    );


  if(
    !ok
  ){

    return;

  }


  const button =
    $(
      "completePickup_"
      +
      pickupRecordId
    );


  if(
    button
  ){

    button.disabled =
      true;


    button.textContent =
      "處理中...";

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .rpc(
        "complete_pickup",
        {
          p_pickup_record_id:
            pickupRecordId
        }
      );


  if(
    error
  ){

    if(
      button
    ){

      button.disabled =
        false;


      button.textContent =
        "✅ 完成接送";

    }


    alert(
      "完成接送失敗：\n"
      +
      error.message
    );


    return;

  }


  let message =
    "✅ 已完成接送";


  if(
    data
  ){

    if(
      data.pickup_status
      ===
      "delayed_pickup"
    ){

      message +=
        "\n\n本次為：延遲接回";

    }


    if(
      data.pickup_status
      ===
      "late_pickup"
    ){

      message +=
        "\n\n本次為：逾時接送";

    }


    if(
      Number(
        data.fee_amount || 0
      )
      >
      0
    ){

      message +=
        "\n費用："
        +
        data.fee_amount
        +
        " 元";


      message +=
        "\n繳費方式：請準備剛好的現金";

    }


    if(
      data.unexcused_late
      ===
      true
    ){

      message +=
        "\n⚠️ 本次列入無故延遲接回 1 次";

    }

  }


  alert(
    message
  );


  await refreshPickupRecords();

}

    "Extended"
  ]
  .forEach(
    name => {

        btn

          "active"
        );

            日期
          </div>

          <div class="infoValue">
            ${escapeHtml(
              r.request_date
              ||
              "-"
            )}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            申請時段
          </div>

          <div class="infoValue">
            ${escapeHtml(
              requestTimeText(
                r
              )
            )}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            托育類別
          </div>

          <div class="infoValue">
            ${escapeHtml(
              careGroupText(
                r.care_group
              )
            )}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            本園安排課後班
          </div>

          <div class="infoValue">
            ${escapeHtml(
              assignedClass
            )}
          </div>

        </div>


        <div class="info">

          <div class="infoLabel">
            建立時間
          </div>

          <div class="infoValue">
            ${escapeHtml(
              formatDateTime(
                r.created_at
              )
            )}
          </div>

        </div>

      </div>


      <div class="reasonBox">

        <b>
          📝 家長原因／備註
        </b>

        <br>

        ${escapeHtml(
          r.reason
          ||
          "未填寫"
        )}

      </div>


      ${
        r.admin_note
        ?
        `
          <div class="reasonBox">

            <b>
              🏫 本園備註
            </b>

            <br>

            ${escapeHtml(

        r

}


/*
==================================================
行政操作區
==================================================
*/

function adminActionHtml(
  r
){

  if(
    r.status !== "pending"
    &&
    r.status !== "waitlist"
  ){

    return `
      <div
        class="helper"
        style="margin-top:10px"
      >
        此申請目前已完成行政處理。
      </div>
    `;

  }


  if(
    r.request_type === "leave"
  ){

    return `

      <div class="actionBox">

        <b>
          行政處理
        </b>

        <div class="actionButtons">

          <button
            class="btn btnGreen"
            onclick="updateRequestStatus(
              '${r.id}',
              'approved'
            )"
          >
            ✅ 確認收到請假
          </button>

        </div>

      </div>
    `;

  }


  if(
    r.request_type === "extended"
    ||
    r.request_type === "temporary"
  ){

    return `

      <div class="actionBox">

        <b>
          行政審核
        </b>


        <div class="actionGrid">

          <div>

            <div class="helper">
              本園安排課後班
            </div>

            <select
              id="class_${r.id}"
            >
              ${aftercareOptions(
                r
              )}
            </select>

          </div>


          <div>

            <div class="helper">
              本園備註（選填）
            </div>

            <input
              id="note_${r.id}"
              value="${escapeHtml(
                r.admin_note
                ||
                ""
              )}"
              placeholder="例：今日安排至蜜蜂班"
            >

          </div>

        </div>


        <div class="actionButtons">

          <button
            class="btn btnGreen"
            onclick="approveCareRequest(
              '${r.id}'
            )"
          >
            ✅ 核准
          </button>


          ${
            r.request_type
            ===
            "temporary"
            ?
            `
              <button
                class="btn btnOrange"
                onclick="updateRequestStatus(
                  '${r.id}',
                  'waitlist'
                )"
              >
                🟡 候補
              </button>
            `
            :
            ""
          }


          <button
            class="btn btnRed"
            onclick="updateRequestStatus(
              '${r.id}',
              'rejected'
            )"
          >
            ❌ 無法安排
          </button>

        </div>

      </div>
    `;

  }


  return "";

}


/*
==================================================
課後班選單
==================================================
*/

function aftercareOptions(
  r
){

  const child =
    childrenMap[
      r.child_id
    ];


  const careGroup =
    r.care_group
    ||
    child?.care_group
    ||
    "mixed";


  const needs18 =
    r.requested_end_time
    &&
    String(
      r.requested_end_time
    )
    .startsWith(
      "18:00"
    );


  const items =
    Object.entries(
      AFTERCARE_CLASSES
    )
    .filter(
      ([code,item]) => {

        if(
          item.group
          !==
          careGroup
        ){

          return false;

        }


        if(
          careGroup === "mixed"
          &&
          needs18
          &&
          item.endTime
          !==
          "18:00"
        ){

          return false;

        }


        return true;

      }
    );


  let html =
    `
      <option value="">
        請選擇課後班
      </option>
    `;


  items.forEach(
    ([code,item]) => {

      const selected =
        r.assigned_aftercare_class_code
        ===
        code
        ?
        "selected"
        :
        "";


      html +=
        `
          <option
            value="${code}"
            ${selected}
          >
            ${code}
            ${escapeHtml(
              item.name
            )}

            ${
              item.endTime
              ?
              "｜至 "
              +
              item.endTime
              :
              ""
            }

          </option>
        `;

    }
  );


  return html;

}


/*
==================================================
發送 LINE 審核通知
==================================================
*/

async function notifyRequestResult(
  requestId
){

  const {
    data:sessionData,
    error:sessionError
  } =
    await supabaseClient
      .auth
      .getSession();


  if(
    sessionError
    ||
    !sessionData
    ||
    !sessionData.session
    ||
    !sessionData.session.access_token
  ){

    throw new Error(
      "目前沒有有效的行政登入狀態，無法發送 LINE 通知。"
    );

  }


  const response =
    await fetch(
      SUPABASE_URL
      +
      "/functions/v1/line-notify-test",
      {

        method:
          "POST",


        headers:{

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer "
            +
            sessionData.session.access_token,

          "apikey":
            SUPABASE_PUBLISHABLE_KEY

        },


        body:
          JSON.stringify(
            {
              requestId
            }
          )

      }
    );


  let result =
    {};


  try{

    result =
      await response.json();

  }
  catch(e){

    result = {
      error:
        "通知服務回傳了無法解析的內容。"
    };

  }


  if(
    !response.ok
  ){

    throw new Error(
      result.error
      ||
      result.message
      ||
      "LINE 通知發送失敗。"
    );

  }


  return result;

}


/*
==================================================
更新後統一處理
==================================================
*/

async function finishRequestUpdate(
  requestId,
  statusLabel
){

  let lineText =
    "LINE 通知已送出。";


  try{

    await notifyRequestResult(
      requestId
    );

  }
  catch(e){

    console.error(
      "LINE 通知失敗：",
      e
    );


    lineText =
      "⚠️ 資料已更新，但 LINE 通知失敗："
      +
      (
        e.message
        ||
        String(e)
      );

  }


  alert(
    "✅ 狀態已更新為「"
    +
    statusLabel
    +
    "」。\n\n"
    +
    lineText
  );


  await refreshRequests();

}


/*
==================================================
核准托育
==================================================
*/

async function approveCareRequest(
  requestId
){

  const classEl =
    $(
      "class_"
      +
      requestId
    );


  const noteEl =
    $(
      "note_"
      +
      requestId
    );


  const classCode =
    classEl
    ?
    classEl.value
    :
    "";


  const adminNote =
    noteEl
    ?
    noteEl.value.trim()
    :
    "";


  if(
    !classCode
  ){

    alert(
      "核准前請先選擇本園安排的課後班。"
    );

    return;

  }


  if(
    !confirm(
      "確定要核准此申請並發送 LINE 通知給家長嗎？"
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("requests")
      .update(
        {

          status:
            "approved",

          assigned_aftercare_class_code:
            classCode,

          admin_note:
            adminNote

        }
      )
      .eq(
        "id",
        requestId
      );


  if(
    error
  ){

    alert(
      "核准失敗：\n\n"
      +
      error.message
    );

    return;

  }


  await finishRequestUpdate(
    requestId,
    "已核准"
  );

}


/*
==================================================
變更申請狀態
==================================================
*/

async function updateRequestStatus(
  requestId,
  newStatus
){

  let confirmText =
    "確定要更新此申請並通知家長嗎？";


  if(
    newStatus === "approved"
  ){

    confirmText =
      "確定已收到並確認這筆請假，並發送 LINE 通知給家長嗎？";

  }


  if(
    newStatus === "waitlist"
  ){

    confirmText =
      "確定將此申請設為候補，並發送 LINE 通知給家長嗎？";

  }


  if(
    newStatus === "rejected"
  ){

    confirmText =
      "確定將此申請設為無法安排，並發送 LINE 通知給家長嗎？";

  }


  if(
    !confirm(
      confirmText
    )
  ){

    return;

  }


  const noteEl =
    $(
      "note_"
      +
      requestId
    );


  const adminNote =
    noteEl
    ?
    noteEl.value.trim()
    :
    null;


  const payload = {

    status:
      newStatus

  };


  if(
    adminNote
    !==
    null
  ){

    payload.admin_note =
      adminNote;

  }


  if(
    newStatus
    !==
    "approved"
  ){

    payload.assigned_aftercare_class_code =
      null;

  }


  const {
    error
  } =
    await supabaseClient
      .from("requests")
      .update(
        payload
      )
      .eq(
        "id",
        requestId
      );


  if(
    error
  ){

    alert(
      "狀態更新失敗：\n\n"
      +
      error.message
    );

    return;

  }


  await finishRequestUpdate(
    requestId,
    statusText(
      newStatus
    )
  );

}


/*
==================================================
工具函式
==================================================
*/

function requestTimeText(
  r
){

  if(
    !r.requested_start_time
    &&
    !r.requested_end_time
  ){

    return "-";

  }


  return (
    shortTime(
      r.requested_start_time
    )
    +
    (
      r.requested_end_time
      ?
      " → "
      +
      shortTime(
        r.requested_end_time
      )
      :
      ""
    )
  );

}


function shortTime(
  value
){

  if(
    !value
  ){

    return "";

  }


  return String(
    value
  )
  .slice(
    0,
    5
  );

}


function requestTypeText(
  type
){

  const map = {

    leave:
      "今日請假",

    temporary:
      "臨時托育",

    extended:
      "延長托育",

    pickup:
      "接送通知",

    late:
      "晚到通報"

  };


  return (
    map[
      type
    ]
    ||
    type
    ||
    "未知"
  );

}


function statusText(
  status
){

  const map = {

    pending:
      "待處理",

    approved:
      "已核准",

    rejected:
      "無法安排",

    waitlist:
      "候補",

    cancelled:
      "已取消"

  };


  return (
    map[
      status
    ]
    ||
    status
    ||
    "未知"
  );

}


function statusClass(
  status
){

  if(
    status === "pending"
  ){

    return "badgePending";

  }


  if(
    status === "approved"
  ){

    return "badgeApproved";

  }


  if(
    status === "rejected"
  ){

    return "badgeRejected";

  }


  if(
    status === "waitlist"
  ){

    return "badgeWaitlist";

  }


  return "badgeOther";

}


function careGroupText(
  value
){

  if(
    value === "mixed"
  ){

    return "混齡";

  }


  if(
    value === "toddler"
  ){

    return "幼幼";

  }


  return (
    value
    ||
    "-"
  );

}


/*
==================================================
供 onclick 安全使用
==================================================
*/

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    "\r",
    "\\r"
  )
  .replaceAll(
    "\n",
    "\\n"
  );

}


function showError(
  text
){

  $("errorBox").textContent =
    text;


  $("errorBox").style.display =
    "block";

}


function hideError(){

  $("errorBox").textContent =
    "";


  $("errorBox").style.display =
    "none";

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/*
==================================================
恢復 Supabase 登入
==================================================
*/

async function restoreSession(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if(
    error
  ){

    $("loginState").textContent =
      "Supabase：讀取登入狀態失敗";

    return;

  }


  if(
    !data
    ||
    !data.session
    ||
    !data.session.user
  ){

    $("loginState").textContent =
      "Supabase：尚未登入行政測試帳號";

    return;

  }


  currentUser =
    data.session.user;


  await validateAdmin();

}
